<!-- ko foreach: khipuMethods -->
<div class="payment-method" data-bind="css: {'_active': $parent.isKhipuMethodChecked(id)}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': 'simplified_' + id, 'value': $parent.getCode()}, checkedValue: true, checked: $parent.isKhipuMethodChecked(id), click: $parent.selectKhipuMethod.bind($parent, $data), visible: $parent.isKhipuRadioVisible()"/>
        <label data-bind="attr: {'for': 'simplified_' + id}" class="label"><span data-bind="text: title"></span></label>
    </div>
    <!-- ko if: $parent.isKhipuMethodChecked(id) -->
    <div class="payment-method-content">
        <!-- ko foreach: $parent.getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parents[1].getRegion($parent.getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parents[1].getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="
                        click: $parent.placeOrder.bind($parent),
                        attr: {title: $t('Place Order')},
                        css: {disabled: !$parent.isPlaceOrderActionAllowed()},
                        enable: ($parent.getCode() == $parent.isChecked())
                        "
                        disabled>
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>
<!-- /ko -->
